openapi: 3.1.0
info:
  title: Project Management Frontend API
  version: 0.2.0
servers:
  - url: /api/v1
paths:
  /auth/wecom/authorize:
    get:
      operationId: getWecomAuthorize
      tags: [Auth]
      parameters:
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: WeCom authorization target for SPA development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WecomAuthorizeResponse'
  /auth/wecom/callback:
    get:
      operationId: getWecomCallback
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Session established.
        '401':
          $ref: '#/components/responses/Error'
  /auth/emergency/login:
    post:
      operationId: emergencyLogin
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Logged in.
        '401':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Mock compatibility login.
        '401':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
        '401':
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getAuthCurrentUser
      tags: [Auth]
      deprecated: true
      responses:
        '200':
          description: Current user compatibility endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
        '401':
          $ref: '#/components/responses/Error'
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      responses:
        '200':
          description: CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/Error'
  /analytics/workspace/summary:
    get:
      operationId: getWorkspaceSummary
      tags: [Workspace]
      responses:
        '200':
          description: Personal workspace summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummaryDto'
  /work-items/my-todos:
    get:
      operationId: getMyTodos
      tags: [Workspace]
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, requirement, task, test, defect]
      responses:
        '200':
          description: Personal todo list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoItemDto'
  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [Workspace]
      responses:
        '200':
          description: Recent activity timeline.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityEventDto'
  /project-type-configs:
    get:
      operationId: getProjectTypeConfigs
      tags: [Configuration]
      responses:
        '200':
          description: Project type configurations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTypeConfigDto'
  /project-type-configs/{id}:
    patch:
      operationId: updateProjectTypeConfig
      tags: [Configuration]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectTypeConfigUpdate'
      responses:
        '200':
          description: Updated project type configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTypeConfigDto'
        '422':
          $ref: '#/components/responses/Error'
  /workflow-definitions:
    get:
      operationId: getWorkflowDefinitions
      tags: [Configuration]
      responses:
        '200':
          description: Default workflows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDto'
  /workflow-definitions/{id}:
    patch:
      operationId: updateWorkflowDefinition
      tags: [Configuration]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Updated workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDto'
        '422':
          $ref: '#/components/responses/Error'
  /workflow-definitions/{id}/validate:
    post:
      operationId: validateWorkflowDefinition
      tags: [Configuration]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowValidationDto'
  /workflow-definitions/{id}/restore-default:
    post:
      operationId: restoreDefaultWorkflowDefinition
      tags: [Configuration]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                row_version:
                  type: integer
      responses:
        '200':
          description: Restored workflow draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDto'
  /role-definitions:
    get:
      operationId: getRoleDefinitions
      tags: [Configuration]
      responses:
        '200':
          description: Role definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDto'
    post:
      operationId: createRoleDefinition
      tags: [Configuration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '200':
          description: Created role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDto'
  /role-definitions/{id}:
    patch:
      operationId: updateRoleDefinition
      tags: [Configuration]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDto'
    delete:
      operationId: deleteRoleDefinition
      tags: [Configuration]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted role.
        '422':
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: getProjects
      tags: [Projects]
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
            enum: [scrum, waterfall]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, archived]
        - name: owner_id
          in: query
          schema:
            type: string
        - name: risk_status
          in: query
          schema:
            type: string
            enum: [healthy, attention, risk]
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Project list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
    post:
      operationId: createProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '200':
          description: Created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDto'
        '422':
          $ref: '#/components/responses/Error'
  /projects/stats:
    get:
      operationId: getProjectStats
      tags: [Projects]
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: owner_id
          in: query
          schema:
            type: string
        - name: risk_status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Project list stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListStatsDto'
  /projects/{id}:
    get:
      operationId: getProject
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDto'
  /projects/{id}/navigation:
    get:
      operationId: getProjectNavigation
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Project navigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNavigationDto'
  /projects/{id}/overview:
    get:
      operationId: getProjectOverview
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Project overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverviewDto'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    WecomAuthorizeResponse:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
    CurrentUserDto:
      type: object
      required: [id, displayName, email, roles, permissions, lastLoginAt]
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        lastLoginAt:
          type: string
          format: date-time
    CsrfTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
    WorkspaceSummaryDto:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummaryCardDto'
    WorkspaceSummaryCardDto:
      type: object
      required: [key, label, value, description, tone]
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: integer
        description:
          type: string
        tone:
          type: string
          enum: [primary, requirement, task, test, defect, danger]
    TodoItemDto:
      type: object
      required:
        [id, type, title, projectName, priority, dueText, status, summary]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [requirement, task, test, defect]
        title:
          type: string
        projectName:
          type: string
        priority:
          type: string
        dueText:
          type: string
        status:
          type: string
        summary:
          type: string
    ActivityEventDto:
      type: object
      required: [id, type, actor, content, timeText, tone]
      properties:
        id:
          type: string
        type:
          type: string
        actor:
          type: string
        content:
          type: string
        timeText:
          type: string
        tone:
          type: string
          enum: [primary, success, warning, danger, info]
    ProjectTypeConfigDto:
      type: object
      required:
        [id, type_key, name, method, row_version, tabs, updated_by, updated_at]
      properties:
        id:
          type: string
        type_key:
          type: string
          enum: [scrum, waterfall]
        name:
          type: string
        method:
          type: string
          enum: [scrum, waterfall]
        row_version:
          type: integer
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTypeTabDto'
        updated_by:
          type: string
        updated_at:
          type: string
    ProjectTypeTabDto:
      type: object
      required: [tab_key, name, route_name, module_key, enabled, sort_order]
      properties:
        tab_key:
          type: string
        name:
          type: string
        route_name:
          type: string
        module_key:
          type: string
        enabled:
          type: boolean
        sort_order:
          type: integer
    ProjectTypeConfigUpdate:
      type: object
      required: [row_version, tabs]
      properties:
        row_version:
          type: integer
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTypeTabDto'
    WorkflowDto:
      type: object
      required:
        [
          id,
          workflow_key,
          name,
          target_type,
          row_version,
          states,
          transitions,
          updated_by,
          updated_at,
        ]
      properties:
        id:
          type: string
        workflow_key:
          type: string
          enum: [requirement, task, defect]
        name:
          type: string
        target_type:
          type: string
          enum: [requirement, task, defect]
        row_version:
          type: integer
        states:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStateDto'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTransitionDto'
        updated_by:
          type: string
        updated_at:
          type: string
    WorkflowStateDto:
      type: object
      required: [state_key, name, color, initial, terminal, sort_order]
      properties:
        state_key:
          type: string
        name:
          type: string
        color:
          type: string
        initial:
          type: boolean
        terminal:
          type: boolean
        sort_order:
          type: integer
    WorkflowTransitionDto:
      type: object
      required:
        [
          transition_key,
          from_state_key,
          to_state_key,
          allowed_role_keys,
          require_comment,
          notify_enabled,
          webhook_enabled,
          sort_order,
        ]
      properties:
        transition_key:
          type: string
        from_state_key:
          type: string
        to_state_key:
          type: string
        allowed_role_keys:
          type: array
          items:
            type: string
        require_comment:
          type: boolean
        notify_enabled:
          type: boolean
        webhook_enabled:
          type: boolean
        sort_order:
          type: integer
    WorkflowUpdate:
      type: object
      required: [row_version, states, transitions]
      properties:
        row_version:
          type: integer
        states:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStateDto'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTransitionDto'
    WorkflowValidationDto:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    RoleDto:
      type: object
      required:
        [
          id,
          role_key,
          name,
          description,
          scope,
          enabled,
          is_system,
          row_version,
          updated_at,
        ]
      properties:
        id:
          type: string
        role_key:
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [global, project]
        enabled:
          type: boolean
        is_system:
          type: boolean
        row_version:
          type: integer
        updated_at:
          type: string
    RoleCreate:
      type: object
      required: [role_key, name, scope]
      properties:
        role_key:
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [global, project]
    RoleUpdate:
      type: object
      required: [row_version, name, description, scope, enabled]
      properties:
        row_version:
          type: integer
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [global, project]
        enabled:
          type: boolean
    ProjectListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummaryDto'
        pagination:
          $ref: '#/components/schemas/PaginationDto'
    PaginationDto:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    ProjectListStatsDto:
      type: object
      required:
        [total_count, active_count, paused_count, archived_count, risk_count]
      properties:
        total_count:
          type: integer
        active_count:
          type: integer
        paused_count:
          type: integer
        archived_count:
          type: integer
        risk_count:
          type: integer
    ProjectSummaryDto:
      type: object
      required:
        [
          id,
          identifier,
          name,
          method,
          status,
          visibility,
          owner,
          current_stage,
          requirement_completion_rate,
          task_completion_rate,
          test_pass_rate,
          blocker_or_critical_defect_count,
          health_status,
          risk_summary,
          updated_at,
        ]
      properties:
        id:
          type: string
        identifier:
          type: string
        name:
          type: string
        method:
          type: string
          enum: [scrum, waterfall]
        status:
          type: string
          enum: [active, paused, archived]
        visibility:
          type: string
          enum: [private, public]
        owner:
          $ref: '#/components/schemas/UserLiteDto'
        current_stage:
          type: string
        requirement_completion_rate:
          type: integer
        task_completion_rate:
          type: integer
        test_pass_rate:
          type: string
        blocker_or_critical_defect_count:
          type: integer
        health_status:
          type: string
          enum: [healthy, attention, risk]
        risk_summary:
          type: string
        updated_at:
          type: string
    ProjectCreateRequest:
      type: object
      required: [identifier, name, method, owner_id, visibility]
      properties:
        identifier:
          type: string
        name:
          type: string
        method:
          type: string
          enum: [scrum, waterfall]
        owner_id:
          type: string
        visibility:
          type: string
          enum: [private, public]
        description:
          type: string
    ProjectDto:
      allOf:
        - $ref: '#/components/schemas/ProjectSummaryDto'
        - type: object
          required: [description]
          properties:
            description:
              type: string
    UserLiteDto:
      type: object
      required: [id, display_name, avatar_url]
      properties:
        id:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
    ProjectNavigationDto:
      type: object
      required: [project, tabs, more_tabs, system_entries, quick_actions]
      properties:
        project:
          $ref: '#/components/schemas/ProjectSummaryDto'
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectNavigationTabDto'
        more_tabs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectNavigationTabDto'
        system_entries:
          type: array
          items:
            $ref: '#/components/schemas/ProjectNavigationTabDto'
        quick_actions:
          type: array
          items:
            type: string
    ProjectNavigationTabDto:
      type: object
      required: [tab_key, name, route, module_key, enabled, available]
      properties:
        tab_key:
          type: string
        name:
          type: string
        route:
          type: string
        module_key:
          type: string
        enabled:
          type: boolean
        available:
          type: boolean
    ProjectOverviewDto:
      type: object
      required:
        [
          health,
          requirement_progress,
          task_progress,
          test_progress,
          defect_summary,
          recent_activity,
        ]
      properties:
        health:
          type: string
        requirement_progress:
          type: integer
        task_progress:
          type: integer
        test_progress:
          type: integer
        defect_summary:
          type: string
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEventDto'
